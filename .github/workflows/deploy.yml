# Alchemy tutorial part 5: https://alchemy.run/cloudflare/tutorial/part-5/
# Cloud jobs run only when both Cloudflare deployment secrets are available.
name: CI and Deploy

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, reopened, synchronize, closed]

permissions:
  contents: read

# Use the same group for all events on a PR so cleanup waits for its deployment.
concurrency:
  group: deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

env:
  STAGE: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.number) || 'prod' }}

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.credentials.outputs.configured }}
    steps:
      # Expose only presence, never secret values. Partial setup is an error.
      - name: Check Cloudflare configuration
        id: credentials
        env:
          CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          if [ -n "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
          elif [ -z "$CF_TOKEN" ] && [ -z "$CF_ACCOUNT" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::Set both Cloudflare secrets, or neither."
            exit 1
          fi

  checks:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun test apps
      - run: bun run build

  deploy:
    needs: [checks, cloudflare]
    if: >-
      needs.cloudflare.outputs.configured == 'true' &&
      github.event.action != 'closed' &&
      (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Deploy
        run: bunx alchemy deploy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  cleanup:
    needs: cloudflare
    if: >-
      needs.cloudflare.outputs.configured == 'true' &&
      github.event_name == 'pull_request' && github.event.action == 'closed' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Verify preview stage
        run: |
          case "$STAGE" in
            pr-[0-9]*) ;;
            *) echo "Refusing to destroy a non-preview stage"; exit 1 ;;
          esac
      - name: Destroy preview
        run: bunx alchemy destroy --stage "$STAGE" --yes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PULL_REQUEST: ${{ github.event.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
